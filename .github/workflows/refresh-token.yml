name: Refresh Instagram token

# Long-lived Instagram tokens expire 60 days after they are issued. Refreshing
# returns a NEW token string, so the repository secret has to be rewritten —
# GITHUB_TOKEN cannot write secrets, hence IG_REFRESH_PAT.

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the long-lived token
        env:
          CURRENT: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS -G https://graph.instagram.com/refresh_access_token \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$CURRENT")

          token=$(echo "$response" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            # The body carries Meta's error message but never the token itself.
            echo "refresh failed: $response" >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "NEW_TOKEN=$token" >> "$GITHUB_ENV"
          echo "expires_in=$(echo "$response" | jq -r '.expires_in') seconds"

      - name: Store the new token
        env:
          GH_TOKEN: ${{ secrets.IG_REFRESH_PAT }}
        run: printf '%s' "$NEW_TOKEN" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
